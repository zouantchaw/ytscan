name = "ytscan-api"
main = "src/worker.ts"
compatibility_date = "2026-03-07"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ytscan"
database_id = "36bf8776-0131-4eea-9e7b-b081856799bb"
migrations_dir = "../../infrastructure/d1/migrations"

[[vectorize]]
binding = "TRANSCRIPTS_INDEX"
index_name = "ytscan-transcripts"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ytscan-assets-wiel"

[vars]
BETTER_AUTH_URL = "https://ytscan-api.wiel.workers.dev"
DEFAULT_CHANNEL_SLUG = "codie-sanchez"
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://ytscan-web.vercel.app"
RESEND_FROM_EMAIL = "onboarding@resend.dev"
RESEND_FROM_NAME = "YTScan"
